apiVersion: apps/v1
kind: Deployment
metadata:
  name: emails-depl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: emails
  template:
    metadata:
      labels:
        app: emails
    spec:
      containers:
        - name: emails
          image: mint1312/emails
          # image: asia.gcr.io/ticketing-dev-508215/emails
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "512Mi"
          env:
            - name: NATS_URL
              value: "nats://nats-srv:4222"
            - name: MONGO_URI
              value: "mongodb://emails-mongo-srv:27017/emails?replicaSet=rs0"
            - name: REDIS_HOST
              value: "emails-redis-srv"
            - name: GMAIL_USER
              valueFrom:
                secretKeyRef:
                  name: google-secret
                  key: GMAIL_USER
            - name: GOOGLE_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: google-secret
                  key: GOOGLE_APP_PASSWORD
            - name: JWT_KEY
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: JWT_KEY
---
apiVersion: v1
kind: Service
metadata:
  name: emails-srv
spec:
  selector:
    app: emails
  ports:
    - name: emails
      protocol: TCP
      port: 3000
      targetPort: 3000
