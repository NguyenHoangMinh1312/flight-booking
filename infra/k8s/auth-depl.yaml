apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-depl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
    spec:
      containers:
        - name: auth
          image: mint1312/auth
          # image: asia.gcr.io/ticketing-dev-508215/auth
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "512Mi"
          env: 
            - name: NATS_URL
              value: "nats://nats-srv:4222"
            - name: MONGO_URI
              value: "mongodb://auth-mongo-srv:27017/auth?replicaSet=rs0"
            - name: JWT_KEY
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: JWT_KEY
            - name: MANAGER_EMAIL
              valueFrom:
                secretKeyRef:
                  name: manager-secret
                  key: MANAGER_EMAIL
            - name: MANAGER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: manager-secret
                  key: MANAGER_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: auth-srv
spec:
  selector:
    app: auth
  ports:
    - name: auth
      protocol: TCP
      port: 3000
      targetPort: 3000
