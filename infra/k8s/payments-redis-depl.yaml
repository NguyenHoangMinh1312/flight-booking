apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments-redis-depl
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payments-redis
  template:
    metadata:
      labels:
        app: payments-redis
    spec:
      containers:
        - name: payments-redis
          image: redis
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: payments-redis-srv
spec:
  selector:
    app: payments-redis
  ports:
    - name: db
      protocol: TCP
      port: 6379
      targetPort: 6379
