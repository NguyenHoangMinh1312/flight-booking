apiVersion: skaffold/v4beta14
kind: Config
manifests:
  rawYaml:
    - ./infra/k8s/*
build:
  local:
    push: false
  # googleCloudBuild:
  #   projectId: ticketing-dev-508215
  artifacts:
    - image: mint1312/auth
    # - image: asia.gcr.io/ticketing-dev-508215/auth
      context: auth
      docker:
        dockerfile: Dockerfile
      sync:
        manual:
          - src: "src/**/*.ts"
            dest: .
    - image: mint1312/client
      context: client
      docker:
        dockerfile: Dockerfile
    - image: mint1312/flights
      context: flights
      docker:
        dockerfile: Dockerfile
      sync:
        manual:
          - src: "src/**/*.ts"
            dest: .
    # - image: asia.gcr.io/ticketing-dev-508215/orders
    - image: mint1312/orders
      context: orders
      docker:
        dockerfile: Dockerfile
      sync:
        manual:
          - src: "src/**/*.ts"
            dest: .
    # - image: asia.gcr.io/ticketing-dev-508215/payments
    - image: mint1312/payments
      context: payments
      docker:
        dockerfile: Dockerfile
      sync:
        manual:
          - src: "src/**/*.ts"
            dest: .
    # - image: asia.gcr.io/ticketing-dev-508215/emails
    - image: mint1312/emails
      context: emails
      docker:
        dockerfile: Dockerfile
      sync:
        manual:
          - src: "src/**/*.ts"
            dest: .